<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/templates/page-template.xhtml">
    <f:event type="preRenderView" listener="#{groupDetails.resetGroup()}" />
    <f:viewAction action="#{groupDetails.onload}" />
    <ui:param name="pageTitle" value="Create New Group" />
    <ui:define name="panel-top">
        <style>
            .btn {
                padding: 10px 20px;
                font-size: 16px;
                color: #fff !important;
                background-color: #007BFF;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: background-color 0.3s ease;
                text-decoration: none;
                display: inline-block;
                text-align: center;
                margin-right: 20px;
            }
            .home-button {
                position: absolute;
                top: 20px;
                left: 20px;
        </style>
        <section>
            <h1>Create a New Group</h1>
            <p>Fill in the details below to create a new group.</p>
                <div class="home-button">
                    <h:link value="Back to All Groups" outcome="allgroups" styleClass="btn" >
                    </h:link>
                </div >
        </section>
    </ui:define>
    <ui:define name="panel-main">
        <f:metadata>
            <f:viewAction action="#{groupDetails.onload}" />
        </f:metadata>
        <section>
            <h:messages styleClass="validation-messages" />

            <!-- Formular für die Gruppenerstellung -->
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel for="title" value="Title" />
                    <h:inputText id="title" value="#{groupDetails.group.title}" required="true" />

                    <h:outputLabel for="topic" value="Topic" />
                    <h:inputText id="topic" value="#{groupDetails.group.topic}" required="true" />

                    <h:outputLabel for="description" value="Description" />
                    <h:inputTextarea id="description" value="#{groupDetails.group.description}" required="true" />

                    <h:outputLabel for="location" value="Location" />
                    <h:inputText id="location" value="#{groupDetails.group.location}" required="true" />

                    <!-- Button zum Erstellen der Gruppe -->
                    <h:commandButton value="Create Group" action="#{groupDetails.submit}" styleClass="btn"/>
                </h:panelGrid>
            </h:form>
        </section>
    </ui:define>
</ui:composition>
</html>
