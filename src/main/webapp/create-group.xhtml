<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/templates/page-template.xhtml">
    <f:metadata>
        <f:viewAction action="#{groupDetails.onload}"/>
        <f:viewParam name="groupId" value="#{groupDetails.groupId}"/>
    </f:metadata>
    <ui:param name="pageTitle" value="Create New Group"/>
    <ui:define name="panel-top">
        <section>
            <h1>Create a New Group</h1>
            <p>Fill in the details below to create a new group.</p>
            <p><h:outputLink value="allgroups.xhtml">Back to All Groups</h:outputLink></p>
        </section>
    </ui:define>
    <ui:define name="panel-main">
        <section>
            <h:messages styleClass="validation-messages"/>
            <h:form>
    <h:panelGrid columns="2">
        <h:outputLabel for="title" value="Title" />
        <h:inputText id="title" value="#{groupDetails.group.title}" required="true" />

        <h:outputLabel for="topic" value="Topic" />
        <h:inputText id="topic" value="#{groupDetails.group.topic}" required="true" />

        <h:outputLabel for="description" value="Description" />
        <h:inputTextarea id="description" value="#{groupDetails.group.description}" required="true" />

        <h:outputLabel for="location" value="Location" />
        <h:inputText id="location" value="#{groupDetails.group.location}" required="true" />

        <h:commandButton value="Create Group" action="#{groupDetails.submit}" />
    </h:panelGrid>
</h:form>

        </section>
    </ui:define>
</ui:composition>
</html>
