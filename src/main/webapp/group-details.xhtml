<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Group Details</title>
</h:head>

<h:body>
    <h1>Group Details</h1>

    <!-- Anzeige der Gruppendetails -->
    <h3>Title: <h:outputText value="#{groupDetails.group.title}" /></h3>
    <p>Topic: <h:outputText value="#{groupDetails.group.topic}" /></p>
    <p>Description: <h:outputText value="#{groupDetails.group.description}" /></p>
    <p>Location: <h:outputText value="#{groupDetails.group.location}" /></p>
    <p>Owner: <h:outputText value="#{groupDetails.group.owner.username}" /></p>

    <!-- Google Maps Link -->
    <h:outputLink value="https://www.google.com/maps?q=#{group.location}" target="_blank">
        View on Google Maps
    </h:outputLink>

    <br/>
    <br/>

    <!-- Zurück-Link -->
    <h:link value="Back to All Groups" outcome="allgroups" />
</h:body>
</html>
