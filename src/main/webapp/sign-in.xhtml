<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/templates/page-template.xhtml">
    <ui:param name="pageTitle" value="Sign Out"/>
    <ui:define name="panel-top">
        <style>
            .btn {
                padding: 10px 20px;
                font-size: 16px;
                color: #fff !important;
                background-color: #007BFF;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: background-color 0.3s ease;
                text-decoration: none;
                display: inline-block;
                text-align: center;
                margin-right: 20px;
            }

            .btn:hover {
                background-color: #0056b3;
            }

            .home-button {
                position: absolute;
                top: 20px;
                left: 20px;
            }

            section {
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 16px;
                background-color: #f9f9f9;
                width: 100%;
                max-width: 1500px;
                margin: 20px auto;
                box-sizing: border-box;
            }

            section h1, section p {
                margin: 0 0 16px 0;
            }

            .validation-messages {
                color: red;
                margin-bottom: 16px;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: bold;
            }

            .form-group input {
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            .button-group {
                display: flex;
                gap: 10px;
                margin: 10px;
            }
        </style>
        <section>
            <ui:fragment rendered="#{not userManager.signedIn}">
                <h1>Sign In</h1>
                <p>Please enter your username and password to sign in.</p>
            </ui:fragment>

            <ui:fragment rendered="#{userManager.signedIn}">
                <h:form>
                    <h1>Welcome, #{userManager.currentUser.firstName}!</h1>
                    <p>You are already signed in.
                        Do you want to Sign Out?</p>
                    <div class="button-group">
                        <h:commandLink action="#{userManager.signOut}" styleClass="btn">Sign Out</h:commandLink>
                        <h:outputLink value="allgroups.xhtml" styleClass="btn">Back to Group Overview</h:outputLink>
                    </div>
                </h:form>
            </ui:fragment>
        </section>
    </ui:define>
    <ui:define name="panel-main">
        <ui:fragment rendered="#{not userManager.signedIn}">
            <section>
                <h:messages styleClass="validation-messages"/>
                <h:form>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <h:inputText id="username" value="#{signIn.username}" size="20"
                                     validatorMessage="Please enter a username consisting of only letters and digits, between 2 and 20 characters long.">
                            <f:validateRegex pattern="[A-Za-z0-9]{2,20}"/>
                        </h:inputText>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <h:inputSecret id="password" value="#{signIn.password}" size="20"
                                       required="true" requiredMessage="Please enter your password."/>
                    </div>

                    <div class="form-group">
                        <h:commandButton value="Submit" action="#{signIn.submit}" styleClass="btn" />
                    </div>
                </h:form>
            </section>
        </ui:fragment>
    </ui:define>
</ui:composition>
</html>
