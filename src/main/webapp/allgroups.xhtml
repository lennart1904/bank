<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/templates/page-template.xhtml">
    <ui:define name="pageTitle">All Groups</ui:define>
    <ui:define name="panel-top">
        <h:head>
            <title>All Groups</title>
            <!-- Google Maps JavaScript API -->
            <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&amp;callback=initMap" async="true"></script>
            <style>
                /* Stil für den Button */
                .btn {
                    padding: 10px 20px;
                    font-size: 16px;
                    color: #fff;
                    background-color: #007BFF;
                    border: none;
                    border-radius: 5px;
                    cursor: pointer;
                    transition: background-color 0.3s ease;
                    text-decoration: none;
                    display: inline-block;
                    text-align: center;
                }

                .btn:hover {
                    background-color: #0056b3;
                }

                .button-group {
                    display: flex;
                    gap: 10px; /* Abstand zwischen Buttons */
                    margin: 20px 0; /* Abstand nach oben und unten */
                }

                .refresh-button {
                    position: absolute;
                    top: 20px;
                    right: 20px;
                }

                .home-button {
                    position: absolute;
                    top: 20px;
                    left: 20px;
                }
                .groups-container {
                    display: grid;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 16px;
                }

                section {
                    border: 1px solid #ddd;
                    border-radius: 8px;
                    padding: 16px;
                    margin: 16px 0;
                    background-color: #f9f9f9;
                    display: inline-block;
                    width: auto;
                }

                section h3 {
                    margin: 0;
                }

                section p, section h3, section a {
                    margin-bottom: 8px;
                }

                section a {
                    align-self: flex-start;
                }
            </style>
        </h:head>
    </ui:define>
    <ui:define name="panel-main">
        <div class="home-button">
            <h:form>
                <ui:fragment rendered="#{not userManager.signedIn}">
                    <h:commandButton value="Sign in" action="sign-in.xhtml?faces-redirect=true" styleClass="btn" />
                    <h:commandButton value="Register" action="user-details.xhtml?faces-redirect=true" styleClass="btn" />
                </ui:fragment>
                <ui:fragment rendered="#{userManager.signedIn}">
                    <h:commandButton value="Sign out" action="#{userManager.signOut}" styleClass="btn" />
                    <h:commandButton value="User Details" action="user-details.xhtml?faces-redirect=true" styleClass="btn" />
                </ui:fragment>
            </h:form>
        </div>
        <div class="refresh-button">
            <h:form>
                <h:commandButton value="Refresh Groups" action="#{groupList.refreshGroups}" styleClass="btn">
                    <f:ajax render="@form" />
                </h:commandButton>
            </h:form>
        </div>

        <h1>All Groups</h1>
        <div class="button-group">
            <!-- Button for "Create New Group" -->
            <h:form>
                <h:commandButton value="Create New Group" action="create-group" styleClass="btn" />
            </h:form>
        </div>
        <!-- Sections for groups -->
        <div class="groups-container">
            <ui:repeat value="#{groupList.groups}" var="group">
                <section>
                <!-- Gruppentitel -->
                <h3><h:outputText value="#{group.title}" /></h3>
                <!-- Kurze Beschreibung -->
                <p><h:outputText value="#{group.shortDescription}" /></p>
                <!-- Link zur Detailseite -->
                <h:link outcome="group-details" styleClass="btn">
                    <f:param name="id" value="#{group.id}" />
                    <h:outputText value="View Details" />
                </h:link>
                </section>
            </ui:repeat>
        </div>
    </ui:define>
</ui:composition>
</html>
