<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>All Groups</title>
    <!-- Google Maps JavaScript API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&amp;callback=initMap" async="true"></script>
</h:head>

<h:body>

    <!-- Include the page-header template -->
    <ui:include src="/templates/page-header.xhtml" />

    <h1>All Groups</h1>

    <!-- Home Button, der zur sign-in.xhtml weiterleitet -->
    <h:form>
        <h:commandButton value="🏠 Home" action="sign-in.xhtml?faces-redirect=true" />
    </h:form>

    <br />
    <!-- Link zur Seite create-group.xhtml -->
    <h:commandButton value="+ Create New Group" outcome="create-group" />
    <br />
    <br />
        <!-- Button zum Aktualisieren der Gruppenliste -->
    <h:form>

    </h:form>


    <!-- Liste der Gruppen -->
    <ul>
        <ui:repeat value="#{groupList.groups}" var="group">
            <li>
                <!-- Gruppentitel -->
                <h3><h:outputText value="#{group.title}" /></h3>
                <!-- Kurze Beschreibung -->
                <p><h:outputText value="#{group.shortDescription}" /></p>

                <!-- Link zur Detailseite -->
                <h:link value="View Details" outcome="group-details">
                    <f:param name="id" value="#{group.id}" />
                </h:link>

            </li>
        </ui:repeat>
    </ul>
<br/>
    <h:commandButton value="🔄 Refresh Groups" action="#{groupList.refreshGroups}">
        <f:ajax render="@form" />
    </h:commandButton>

    <!-- Include the page-footer template -->
    <ui:include src="/templates/page-footer.xhtml" />
</h:body>
</html>
