<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>All Groups</title>
    <!-- Google Maps JavaScript API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&amp;callback=initMap" async="true"></script>
    <style>
        /* Stil für den Button */
        .btn {
            display: flex;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            gap: 10px; /* Abstand zwischen Buttons */
            justify-content: center; /* Zentriert Buttons horizontal */
            margin: 20px 0; /* Abstand nach oben und unten */
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
        section {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            background-color: #f9f9f9;
        }

        section h3 {
            margin: 0;
        }
    </style>
</h:head>
<h:body>
    <!-- Include the page-header template -->
    <ui:include src="/templates/page-header.xhtml" />
    <h1>All Groups</h1>
    <div class="button-group">
        <!-- Home Button -->
        <h:form>
            <h:commandButton value="Home" action="sign-in.xhtml?faces-redirect=true" styleClass="btn" />
        </h:form>
        <!-- Button für "Create New Group" -->
        <h:form>
            <h:commandButton value="Create New Group" action="create-group" styleClass="btn" />
        </h:form>
        <!-- Button für "Refresh Groups" -->
        <h:form>
            <h:commandButton value="Refresh Groups" action="#{groupList.refreshGroups}" styleClass="btn">
                <f:ajax render="@form" />
            </h:commandButton>
        </h:form>
    </div>
    <!-- Sektionen für Gruppen -->
    <ui:repeat value="#{groupList.groups}" var="group">
        <section>
            <!-- Gruppentitel -->
            <h3><h:outputText value="#{group.title}" /></h3>
            <!-- Kurze Beschreibung -->
            <p><h:outputText value="#{group.shortDescription}" /></p>
            <!-- Link zur Detailseite -->
            <h:link value="View Details" outcome="group-details">
                <f:param name="id" value="#{group.id}" />
            </h:link>
            <!-- Google Maps Link -->
            <h:outputLink value="https://www.google.com/maps?q=#{group.location}" target="_blank">
                View on Google Maps
            </h:outputLink>
        </section>
    </ui:repeat>

    <!-- Include the page-footer template -->
    <ui:include src="/templates/page-footer.xhtml" />
</h:body>
</html>
